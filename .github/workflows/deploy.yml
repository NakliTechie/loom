# Fallback deploy path: GitHub pushes to Cloudflare. Arm it by adding the repo secret
# CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"). If the Worker is connected to
# this repo through Cloudflare Workers Builds (the preferred "CF pulls from GitHub" path),
# delete this file so the site is not deployed twice per push.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_VIA_ACTIONS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
